# Gerbang deterministik mesin eksplorasi (rencana mesin v1 §2: gerbang tanpa jaringan dan tanpa kunci API di CI).
name: mesin-gerbang
on:
  pull_request:
    paths: ["mesin/**", ".github/workflows/mesin-gerbang.yml"]
  push:
    branches: [main]
    paths: ["mesin/**"]
jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema rfc3339-validator pyyaml
      - run: python3 mesin/alat/periksa_gerbang.py
