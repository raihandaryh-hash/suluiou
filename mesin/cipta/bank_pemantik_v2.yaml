# Bank pemantik statis jalur cipta (M3b, L5b mode c) · v2 · 14 Nov 2026
# Tinjauan peninjau independen Fable 5.2 (ditunjuk Raihan 14 Nov 09.10 sebagai peninjau): 3 SETUJU, 11 UBAH, 0 TOLAK, dua usulan butir baru.
# Semua teks pengganti dan kedua usulan dipakai utuh; pembuka bank kemiskinan diambil dari butir umum (catatan peninjau).
# Label: PUTUSAN ATAS DELEGASI. v1 tetap tersimpan sebagai riwayat.
# Mode (c): gagasan anak tidak dikirim ke model; pertanyaan diambil dari bank ini menurut aturan tetap. Jujur disebut generik.
# Aturan isi (G3b.2 mode c): tiap butir pertanyaan, diakhiri tanda tanya, tanpa solusi, saran tindakan, vonis, angka, kata kuantitas.
