# Templat langkah pertama (mata rantai 5, G3.1) · v1 · ditulis 14 Nov 2026 08.51 WIB · menunggu tinjauan sekali (rencana §4.4)
# Label: PUTUSAN ATAS DELEGASI. Aturan isi: tanpa angka (skema), tanpa kata vonis (G3.4), bisa dikerjakan sendiri atau
# dengan satu orang dalam batas hari, tidak meminta data pribadi, tidak menyuruh membayar. {peran} dan {kebutuhan_ringkas}
# diisi dari rantai yang sama; {tempat} dipilih dari daftar tetap per peran (puskesmas, posyandu, kantor desa, sekolah, komunitas).
templat:
  amati_dan_tanya:
    teks: "Datangi {tempat} terdekat saat jam layanan, amati apa yang dikerjakan {peran}, lalu tanyakan satu hal: bagian mana dari pekerjaan mereka yang paling butuh bantuan untuk {kebutuhan_ringkas}."
    paling_lama_hari: 14
    butuh_orang_lain: true
    cocok_untuk: [formal, nonformal]
  baca_pedoman:
    teks: "Baca bagian tugas {peran} di pedoman resmi yang tercantum pada jalur ini, lalu tulis tiga hal yang sudah bisa kamu lakukan dan satu hal yang ingin kamu pelajari."
    paling_lama_hari: 7
    butuh_orang_lain: false
    cocok_untuk: [formal, nonformal, sukarela]
  tanya_orang_dekat:
    teks: "Ceritakan jalur ini kepada orang yang kamu percaya, lalu tanyakan apakah mereka mengenal seseorang yang pernah menjadi {peran}."
    paling_lama_hari: 7
    butuh_orang_lain: true
    cocok_untuk: [formal, nonformal, sukarela]
  daftar_kegiatan:
    teks: "Cari tahu di {tempat} kapan kegiatan berikutnya yang melibatkan {peran}, dan tanyakan apakah warga boleh ikut membantu atau menonton."
    paling_lama_hari: 21
    butuh_orang_lain: true
    cocok_untuk: [nonformal, sukarela]
aturan_pilih: "nonformal/sukarela → daftar_kegiatan bila {tempat} diketahui, selain itu amati_dan_tanya; formal → baca_pedoman; mode (c) di bawah 18 tahun → tanya_orang_dekat saja"
