# Bank kandidat jenis kebutuhan · v2 · ditulis 13 Nov 2026 16.10 WIB (jam sistem), dibekukan SEBELUM angka kandidat baru diambil.
# Label: PUTUSAN ATAS DELEGASI 13 Nov 2026 (dasar: "Lanjut" Raihan 16.09), bisa dibalik. Bank v1 tetap beku dan tidak disunting.
# Alasan: uji stabilitas saringan (G2.3) butuh >=30 kandidat lengkap, tetapi 24 dari 33 kandidat v1 tidak punya hitungan
#   orang terdampak, kebanyakan karena satuannya bukan orang (ton, desa, masjid, rupiah, indeks). Lihat uji/STATUS_ME2.md.
# Aturan pemilihan tambahan (ditetapkan sebelum nilai mana pun dilihat):
#   1. satuan indikator = orang (bukan rumah tangga, lembaga, wilayah, ton, rupiah);
#   2. calon sumber = publikasi resmi nasional (BPS, kementerian, BNPB, KPU) dengan tahun data <= 2025;
#   3. dipetakan ke sub-tantangan yang ada di src/data/jalanBaktiContent.ts (baris 96-176), tanpa sub-tantangan baru;
#   4. tidak dipilih karena dugaan nilai atau dugaan peringkat; status_sumber semua belum_dicek sampai diambil.
# Kandidat v1 tetap anggota bank (33). Kandidat yang tetap tanpa hitungan orang dicatat "belum lengkap", tidak dihapus.
versi: bank-kandidat/2
dibekukan: 2026-11-13
