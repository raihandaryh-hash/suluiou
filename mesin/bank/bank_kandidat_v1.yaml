# Bank kandidat jenis kebutuhan · v1 · BEKU sejak commit pertama di cabang mesin-me1-fondasi
# Gerbang G2.0 (rencana mesin v1 isi v1.3): >=30 jenis kebutuhan, minimal 3 per medan K1–K7,
# ditulis dan dibekukan SEBELUM sumber dipilih. Label: SINTESIS (sesi mesin, 12 Nov 2026).
# Medan dan sub-tantangan diambil dari src/data/jalanBaktiContent.ts (main @ 42e7d38), baris 96–176.
# Kolom "sumber_kandidat" hanya calon. Statusnya diuji SU-0 (berkas terunduh, sidik, kutipan syarat pakai).
# status_sumber: diketahui_ada = tercatat di riset E5/RISET 12 Nov; belum_dicek = dari ingatan, wajib SU-0.
# Bank ini tidak memuat bobot. Bobot saringan ditulis terpisah (mesin/bank/bobot_v1.yaml) sebelum skor.
# Perubahan bank sesudah beku = versi baru (bank_kandidat_v2.yaml) dengan alasan tertulis; v1 tidak disunting.

