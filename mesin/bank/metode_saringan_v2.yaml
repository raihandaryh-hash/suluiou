keterpecahan_bukti_lama: "Bukti dihitung berapa pun umurnya selama tidak dicabut atau dibantah evaluasi yang lebih baru. Tahun bukti wajib tampil di kartu dan di keluaran saringan. Bukti berumur >10 tahun diberi tanda 'bukti lama' tanpa pengurangan skor. Alasan: evaluasi dampak yang ketat jarang diulang; membuangnya karena umur akan menyamakan masalah yang punya bukti dengan yang tidak punya."
